server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exstasia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:REPLACE_ME_SET_JWT_SECRET_ENV_VAR}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.admin.email=${ADMIN_EMAIL:admin@exstasia.com}
app.admin.password=${ADMIN_PASSWORD:changeme}

app.uploads.dir=${UPLOADS_DIR:/uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

logging.level.com.exstasia=INFO
