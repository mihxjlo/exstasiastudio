server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exstasia}
spring.datasource.username=${DB_USER:postgres}
# No default: startup must fail loudly rather than fall back to a guessable password.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Safe by default: 'validate' only checks the schema matches the entities and will
# not alter a live database. Set JPA_DDL_AUTO=update for the first boot against an
# empty database (fresh Compose volume or a new cluster), then switch back.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:REPLACE_ME_SET_JWT_SECRET_ENV_VAR}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.admin.email=${ADMIN_EMAIL:admin@exstasia.com}
# No default: an unset ADMIN_PASSWORD must stop the app, not seed a known password.
app.admin.password=${ADMIN_PASSWORD}

app.uploads.dir=${UPLOADS_DIR:/uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Trust X-Forwarded-* from the ingress so the login throttle sees real client IPs
# rather than the ingress controller's address.
server.forward-headers-strategy=framework

app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

logging.level.com.exstasia=INFO
