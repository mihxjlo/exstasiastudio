apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exstasia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mihxjlo/exstasiastudio.git
    targetRevision: HEAD
    path: k8s
    directory:
      exclude: "{argocd-app.yaml,*-secret.yaml,*-secret.example.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: exstasia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
