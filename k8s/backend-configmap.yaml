apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  namespace: exstasia
data:
  DB_URL: "jdbc:postgresql://postgres:5432/exstasia"
  DB_USER: "postgres"
  ADMIN_EMAIL: "admin@exstasia.com"
  CORS_ORIGINS: "http://exstasia.local"
  UPLOADS_DIR: "/uploads"
  # 'validate' never alters the live schema. Set to "update" for the very first
  # boot against a brand-new database, then change it back and re-commit.
  JPA_DDL_AUTO: "validate"
