name: Build and push Docker images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Enables building arm64 images on an amd64 runner. Oracle Cloud's Always-Free
      # instances are ARM, so amd64-only images would fail with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            mihxjlo/exstasia-backend:latest
            mihxjlo/exstasia-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}
          tags: |
            mihxjlo/exstasia-frontend:latest
            mihxjlo/exstasia-frontend:${{ github.sha }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|mihxjlo/exstasia-backend:.*|mihxjlo/exstasia-backend:${{ github.sha }}|" k8s/backend-deployment.yaml
          sed -i "s|mihxjlo/exstasia-frontend:.*|mihxjlo/exstasia-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push
